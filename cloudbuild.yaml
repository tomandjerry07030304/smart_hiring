# ============================================================================
# Google Cloud Build Configuration for Smart Hiring System
# Builds and deploys to Cloud Run with spaCy NLP support
# ============================================================================

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-hiring-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-hiring-backend:latest'
      - '-f'
      - 'Dockerfile.full'
      - '.'
    id: 'build-image'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/smart-hiring-backend:$COMMIT_SHA'
    id: 'push-image'
    waitFor:
      - 'build-image'

  # Step 3: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/smart-hiring-backend:latest'
    id: 'push-latest'
    waitFor:
      - 'build-image'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'smart-hiring-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smart-hiring-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-env-vars'
      - 'FLASK_ENV=production,PYTHONUNBUFFERED=1'
    id: 'deploy-cloud-run'
    waitFor:
      - 'push-image'

# Substitution variables (can be overridden)
substitutions:
  _REGION: 'us-central1'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Artifacts to store
images:
  - 'gcr.io/$PROJECT_ID/smart-hiring-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/smart-hiring-backend:latest'

# Build timeout (15 minutes for spaCy model download)
timeout: '900s'
